name: Build and test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install conversion engine
        run: brew install --cask libreoffice
      - name: Unit and integration tests
        run: swift test
      - name: Standalone conversion checks
        run: ./scripts/test.sh
      - name: Build application
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PDFMe-macOS
          path: dist/*.zip
